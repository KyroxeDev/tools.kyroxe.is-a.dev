<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS LOOKUP / KYROXE_</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <main class="shell">
    <header><a class="wordmark" href="/">KYROXE_</a><span class="header-meta">DNS.LOOKUP // MODULE 01</span></header>
    <section class="tool-hero"><p class="eyebrow">MODULE 01 / PUBLIC NETWORK DATA</p><h1>DNS LOOKUP<span class="blink">_</span></h1><p class="lede">Resolve records. Find what the public internet already knows.</p></section>
    <form id="lookup-form" class="lookup"><label for="domain">ENTER DOMAIN OR HOSTNAME</label><div class="input-row"><input id="domain" name="domain" placeholder="example.com" autocomplete="off" required><button type="submit">RUN QUERY <span>↗</span></button></div><p class="hint">A / AAAA / CNAME / MX / NS / TXT / SOA / CAA / SRV</p></form>
    <section id="results" class="results" hidden><div class="result-head"><div><p class="eyebrow">QUERY RESULT</p><h2 id="target"></h2></div><button id="copy-link" class="quiet" type="button">COPY API URL</button></div><div id="message" class="message"></div><div class="grid"><article><h3>DNS RECORDS</h3><div id="records"></div></article><article><h3>DISCOVERED SUBDOMAINS <small id="count"></small></h3><div id="subdomains"></div></article></div></section>
    <footer><a href="/">← ALL TOOLS</a><span>REAL DATA ONLY</span></footer>
  </main><script src="/app.js"></script>
</body></html>
